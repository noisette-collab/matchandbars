<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fixtures & Kick-off Times | Match & Bars</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="favicon.png" type="image/png" />
  <style>
    .fixtures { display: flex; flex-direction: column; gap: 12px; margin: 1.5rem 0; }
    .fixture { display: flex; gap: 16px; padding: 12px 16px; background: #fff; border-radius: 12px; text-decoration: none; color: inherit; border: 1px solid #eee; }
    .fixture:hover { border-color: #ccc; }
    .date { min-width: 90px; font-weight: 600; color: #555; }
    .match strong { display: block; font-size: 16px; }
    .comp { font-size: 13px; color: #777; margin-top: 2px; }
    .competition-title { margin: 28px 0 8px; font-size: 18px; font-weight: 700; }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap nav">
      <a class="logo" href="/">
        <img src="logo.jpg" alt="Match & Bars" width="40" height="56" />
        <span>Match & Bars</span>
      </a>
      <nav>
        <a href="/">Directory</a>
        <a href="fixtures.html" class="on">Fixtures</a>
        <a href="/#bars-owners">Got a bar?</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <h1>Fixtures</h1>
    <p>Click a match to see bars and peñas near you.</p>
    <div id="fixtures" class="fixtures">Loading fixtures…</div>
  </main>

  <script>
    async function loadFixtures() {
      try {
        const res = await fetch('data/fixtures.json?t=' + Date.now());
        const data = await res.json();
        const container = document.getElementById('fixtures');
        container.innerHTML = '';

        // Highlights first
        if (data.highlights && data.highlights.length) {
          const h = document.createElement('div');
          h.className = 'competition-title';
          h.textContent = 'Highlights';
          container.appendChild(h);
          data.highlights.forEach(m => container.appendChild(createFixture(m)));
        }

        // Competitions
        if (Array.isArray(data.competitions)) {
          data.competitions.forEach(comp => {
            if (!comp.matches || !comp.matches.length) return;
            const title = document.createElement('div');
            title.className = 'competition-title';
            title.textContent = comp.name;
            container.appendChild(title);
            comp.matches.forEach(m => {
              m.competition = comp.name;
              container.appendChild(createFixture(m));
            });
          });
        }
      } catch (err) {
        document.getElementById('fixtures').textContent = 'Error loading fixtures.';
        console.error(err);
      }
    }

    function createFixture(m) {
      const a = document.createElement('a');
      a.className = 'fixture';
      const team = guessTeam(m.home) || guessTeam(m.away) || '';
      a.href = `/?team=${team}&match=${encodeURIComponent(m.home + ' vs ' + m.away)}`;
      a.innerHTML = `
        <div class="date">${formatDate(m.date)}<br>${m.time || ''}</div>
        <div class="match">
          <strong>${m.home} vs ${m.away}</strong>
          <div class="comp">${m.competition || ''}</div>
        </div>
      `;
      return a;
    }

    function formatDate(iso) {
      if (!iso) return '';
      const d = new Date(iso + 'T12:00:00');
      return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    }

    function guessTeam(name) {
      const n = (name || '').toLowerCase();
      if (n.includes('barcelona') || n.includes('barça')) return 'barca';
      if (n.includes('real madrid') || n.includes('madrid')) return 'madrid';
      if (n.includes('arsenal')) return 'arsenal';
      if (n.includes('liverpool')) return 'liverpool';
      if (n.includes('bayern')) return 'bayern';
      if (n.includes('manchester united') || n.includes('man utd')) return 'manutd';
      return '';
    }

    loadFixtures();
  </script>
</body>
</html>
